<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>顔写真登録・自動学習</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/common.js"></script>
    <style>
        .progress-box {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            background: #fff;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        .step-item {
            flex: 1;
            text-align: center;
            font-weight: bold;
            font-size: 13px;
            color: #888;
        }
        .step-item.active {
            color: #0000ff;
            font-size: 15px;
        }
        .step-item.done {
            color: #2e7d32;
        }
        .count-badge {
            display: inline-block;
            background: #eee;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
<div class="kiosk" style="max-width: 600px; margin: 30px auto; padding: 20px;">
    <h1 class="page-title">顔写真登録 (各方向3枚撮影)</h1>
    
    <div class="card">
        <div class="form-row">
            <label class="req">登録名</label>
            <div>
                <input type="text" id="personName" placeholder="例: yamada" style="width: 100%;">
            </div>
        </div>

        <div class="progress-box">
            <div class="step-item active" id="step-front">
                1. 正面<br>
                <span class="count-badge" id="count-front">0 / 3 枚</span>
            </div>
            <div class="step-item" id="step-right">
                2. 右向き<br>
                <span class="count-badge" id="count-right">0 / 3 枚</span>
            </div>
            <div class="step-item" id="step-left">
                3. 左向き<br>
                <span class="count-badge" id="count-left">0 / 3 枚</span>
            </div>
        </div>

        <div id="msg" style="margin-bottom: 12px;"></div>

        <div class="camera" id="cam" style="width: 100%; aspect-ratio: 4/3; margin-bottom: 16px; position: relative;">
            <video id="video" autoplay playsinline muted style="width:100%; height:100%; object-fit:cover; transform:scaleX(-1);"></video>
            <span id="camText" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff;">カメラ未接続</span>
            <div class="face hidden" id="face" style="position:absolute; width:46%; height:62%; border:3px dashed #4caf50; border-radius:50%; top:50%; left:50%; transform:translate(-50%,-50%);"></div>
        </div>

        <div class="actions" style="justify-content: center; gap: 10px;">
            <button class="btn primary" id="startBtn">カメラ起動・撮影開始</button>
            <button class="btn hidden" id="captureBtn" style="background: #2e7d32; color: #fff;">パシャリ (撮影)</button>
        </div>
    </div>
    
    <div style="text-align: center; margin-top: 20px;">
        <a href="/" class="btn">打刻画面へ戻る</a>
    </div>
</div>

<script>
const video = document.getElementById('video');
const camText = document.getElementById('camText');
const faceGuide = document.getElementById('face');
const startBtn = document.getElementById('startBtn');
const captureBtn = document.getElementById('captureBtn');
const nameInput = document.getElementById('personName');
const msgDiv = document.getElementById('msg');

// 進行管理ステート
const steps = ['front', 'right', 'left'];
const stepLabels = { front: '正面', right: '右向き', left: '左向き' };
const requiredPerPose = 3; // 各方向3枚
let currentStepIndex = 0;
let counts = { front: 0, right: 0, left: 0 };
let stream = null;

function updateUI() {
    steps.forEach((pose, idx) => {
        const item = document.getElementById(`step-${pose}`);
        const badge = document.getElementById(`count-${pose}`);
        badge.textContent = `${counts[pose]} / ${requiredPerPose} 枚`;
        
        item.classList.remove('active', 'done');
        if (counts[pose] >= requiredPerPose) {
            item.classList.add('done');
        } else if (idx === currentStepIndex) {
            item.classList.add('active');
        }
    });
}

startBtn.onclick = async () => {
    const name = nameInput.value.trim();
    if (!name) {
        msgDiv.innerHTML = '<div class="msg err">先に登録する名前を入力してください。</div>';
        return;
    }
    
    try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        camText.classList.add('hidden');
        faceGuide.classList.remove('hidden');
        startBtn.classList.add('hidden');
        captureBtn.classList.remove('hidden');
        nameInput.disabled = true;
        
        msgDiv.innerHTML = `<div class="msg info">まずは<b>【${stepLabels[steps[currentStepIndex]]}】</b>を向いて撮影ボタンを押してください。</div>`;
    } catch (e) {
        msgDiv.innerHTML = `<div class="msg err">カメラ起動失敗: ${e.message}</div>`;
    }
};

captureBtn.onclick = async () => {
    const currentPose = steps[currentStepIndex];
    const name = nameInput.value.trim();

    // 画像のデコード
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = canvas.toDataURL('image/jpeg', 0.85);

    msgDiv.innerHTML = '<div class="msg info">判定中...</div>';

    try {
        const response = await fetch('/api/save_face', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name, image: imageData, pose: currentPose })
        });
        const result = await response.json();

        if (result.success) {
            counts[currentPose]++;
            updateUI();
            
            if (counts[currentPose] < requiredPerPose) {
                msgDiv.innerHTML = `<div class="msg ok">【成功】${stepLabels[currentPose]} (${counts[currentPose]}/${requiredPerPose}枚目) 保存完了！あと${requiredPerPose - counts[currentPose]}枚撮影してください。</div>`;
            } else {
                // 次の方向へ移行
                currentStepIndex++;
                if (currentStepIndex < steps.length) {
                    const nextPose = steps[currentStepIndex];
                    msgDiv.innerHTML = `<div class="msg ok"><b>${stepLabels[currentPose]} の撮影完了！</b> 次は<b>【${stepLabels[nextPose]}】</b>を向いて撮影してください。</div>`;
                } else {
                    // 全ステップ完了 -> 自動学習を開始
                    await triggerAutoTraining();
                }
            }
        } else {
            msgDiv.innerHTML = `<div class="msg err">${result.message}</div>`;
        }
    } catch (err) {
        msgDiv.innerHTML = '<div class="msg err">通信エラーが発生しました。</div>';
    }
};

// 自動学習APIの呼び出し
async function triggerAutoTraining() {
    captureBtn.classList.add('hidden');
    msgDiv.innerHTML = '<div class="msg info"><b>全9枚の撮影が完了しました！AIモデルの自動学習を実行中... (数秒かかります)</b></div>';

    try {
        const response = await fetch('/api/train_faces', { method: 'POST' });
        const result = await response.json();

        if (result.success) {
            msgDiv.innerHTML = `<div class="msg ok" style="font-size:16px;"><b>🎉 ${result.message}</b><br>すぐに顔認証打刻が利用可能です。</div>`;
        } else {
            msgDiv.innerHTML = `<div class="msg err">自動学習に失敗しました: ${result.message}</div>`;
        }
    } catch (e) {
        msgDiv.innerHTML = '<div class="msg err">学習リクエスト中に通信エラーが発生しました。</div>';
    }
}
</script>
</body>
</html>
