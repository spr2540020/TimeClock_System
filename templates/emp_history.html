<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>出退勤履歴 - 打刻システム</title><link rel="stylesheet" href="/static/style.css"><script src="/static/common.js"></script></script></head>
<body data-role="emp" data-active="history">

<h1 class="page-title">出退勤履歴</h1>
<div class="card">
  <div class="row">
    <label for="ym"><b>対象月</b></label>
    <select id="ym" style="min-width:0">
      <option value="2026-11">2026年11月</option>
      <option value="2026-10">2026年10月</option>
      <option value="2026-09">2026年9月</option>
      <option value="2026-08">2026年8月（履歴なし）</option>
    </select>
  </div>
</div>
<div id="out"></div>

<script>

async function render() {

    console.log("render start");

    const [year, month] =
        $('#ym')
            .value
            .split('-');

    console.log(year, month);

    const response =
        await fetch(
            `/api/logs?year=${year}&month=${month}`
        );

    console.log("fetch success");
    const logs =
        await response.json();

    const out =
        $('#out');

    if (logs.length === 0) {

        out.innerHTML =
            '<div class="empty">出退勤情報がありません</div>';

        return;
    }

    out.innerHTML = `
    <div class="tbl-wrap">

    <table class="tbl">

        <tr>
            <th>名前</th>
            <th>種別</th>
            <th>信頼度</th>
            <th>打刻時刻</th>
        </tr>

        ${logs.map(log => `

        <tr>

            <td>${log.name}</td>

            <td>${log.type}</td>

            <td>
                ${(log.score * 100).toFixed(1)}%
            </td>

            <td>${log.time}</td>

        </tr>

        `).join('')}

    </table>

    </div>
    `;
}
console.log("script loaded");
$('#ym').onchange = render; render();
</script>
</body></html>
