<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>打刻履歴</title>

    <style>

        body{
            font-family:sans-serif;
            margin:30px;
        }

        table{

            width:100%;
            border-collapse:collapse;

        }

        th,td{

            border:1px solid #ccc;
            padding:10px;
            text-align:center;

        }

        th{

            background:#f0f0f0;

        }

    </style>

</head>

<body>

<h1>打刻履歴</h1>

<table>

    <tr>

        <th>名前</th>
        <th>種別</th>
        <th>信頼度</th>
        <th>時刻</th>

    </tr>

    {% for log in logs %}

    <tr>

        <td>{{ log[0] }}</td>
        <td>{{ log[1] }}</td>
        <td>{{ "%.2f"|format(log[2]) }}</td>
        <td>{{ log[3] }}</td>

    </tr>

    {% endfor %}

</table>

</body>

</html>
